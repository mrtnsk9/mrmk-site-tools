name: Build release package

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Build installable plugin ZIP
        run: |
          mkdir -p dist/mrmk-site-tools
          git archive --format=tar "${GITHUB_SHA}" -- \
            mrmk-site-tools.php \
            index.php \
            LICENSE \
            includes/ \
            assets/ \
          | tar -xf - -C dist/mrmk-site-tools
          cd dist
          zip -qr "${GITHUB_WORKSPACE}/mrmk-site-tools.zip" mrmk-site-tools

      - name: Attach package to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" "${GITHUB_WORKSPACE}/mrmk-site-tools.zip" --clobber
